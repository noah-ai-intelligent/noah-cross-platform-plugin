# Static server for the Office add-in. Every page here is loaded inside a
# Word/Excel/PowerPoint taskpane or dialog webview, not a normal browser tab
# — no SPA fallback needed, each entry (taskpane/login/commands) is its own
# real file from the multi-entry Vite build (see vite.config.ts).

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index taskpane/index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /manifest.xml {
        default_type application/xml;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
